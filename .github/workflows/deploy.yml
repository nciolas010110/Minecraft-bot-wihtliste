name: Deploy Minecraft Bot

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Abhängigkeiten installieren und Tests ausführen
        run: npm ci && npm test

      - name: Bot auf dem Server aktualisieren
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            cd /opt/minecraft-bot
            git pull origin main
            npm ci --omit=dev
            systemctl restart mc-bot.service
            systemctl is-active --quiet mc-bot.service